name: ci

on:
  push:
  pull_request:
  # The slow suites take minutes: weekly and on demand.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  # Build, the default suites, and the installed binary run from elsewhere. Linux and
  # macOS link minigraph against minimap2 differently (cmake/minigraph_exports_*.txt), so both run.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # A pinned image (ubuntu-latest moves between releases), and apt fetches retried: a mirror that
      # fails once should not fail the build. bzip2, lzma and libdeflate give htslib its CRAM codecs.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential cmake zlib1g-dev \
            libbz2-dev liblzma-dev libdeflate-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake zlib xz libdeflate || true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/_install"

      - name: Build
        run: cmake --build build -j

      - name: Test
        shell: bash
        run: |
          # On failure, repeat the failed checks at the end: a suite's output is long.
          ctest --test-dir build --output-on-failure --test-output-size-failed 2000000 || {
            echo "---- failed checks ----"; grep -h "^  FAIL " build/Testing/Temporary/LastTest.log; exit 1; }

      - name: No script hardcodes a developer's interpreter path
        shell: bash
        run: |
          if git ls-files 'tests/*.sh' 'scripts/*' 'dev/*' | xargs grep -nE '(~|\$HOME|/home/[a-z]+|/Users/[a-z.]+)/[a-zA-Z0-9_.-]*(conda|env)[a-zA-Z0-9_.-]*/bin/' 2>/dev/null; then
            echo "hardcoded interpreter path above; use PATH or an overridable variable" >&2
            exit 1
          fi

      - name: Install, then run the installed binary from elsewhere
        shell: bash
        run: |
          cmake --install build
          find _install -type f | sort
          cd /
          "$GITHUB_WORKSPACE/_install/bin/panvar" --help > /dev/null
          "$GITHUB_WORKSPACE/_install/bin/panvar" bubble --help > /dev/null

  # The slow suites: rebuild drives minigraph end to end, the only runtime check of its symbol
  # localization on Linux.
  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential cmake zlib1g-dev \
            libbz2-dev liblzma-dev libdeflate-dev
      - if: runner.os == 'macOS'
        run: brew install cmake zlib xz libdeflate || true
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPANVAR_SLOW_TESTS=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
